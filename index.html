<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#f4f8ef">
    <meta name="msapplication-navbutton-color" content="#f4f8ef" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Zenith" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zenith" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/zenith-icon-192-v6.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/zenith-icon-180-v6.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1&amp;display=block" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
    <title>Zenith</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background-color: #f4f8ef;
      }

      body {
        overflow-x: hidden;
      }

      .initial-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 13px;
        min-height: 100vh;
        background: rgba(244, 248, 239, 0.94);
        color: #18432c;
        font-family: Arial, sans-serif;
      }

      .initial-loader__content {
        display: grid;
        place-items: center;
        gap: 13px;
        text-align: center;
      }

      .initial-loader__mark {
        position: relative;
        width: 76px;
        height: 76px;
        display: grid;
        place-items: center;
        border: 1px solid #cee0ca;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 18px 45px rgba(31, 76, 43, 0.14);
      }

      .initial-loader__mark::before,
      .initial-loader__mark::after {
        content: "";
        position: absolute;
        border: 2px solid transparent;
        border-top-color: #3c8556;
        border-radius: 50%;
        animation: initialLoaderOrbit 1s linear infinite;
        transform-origin: center;
      }

      .initial-loader__mark::before {
        inset: -8px;
      }

      .initial-loader__mark::after {
        inset: 7px;
        border-top-color: #91bd89;
        animation-direction: reverse;
        animation-duration: 1.5s;
      }

      .initial-loader__glow {
        display: none;
      }

      .initial-loader svg {
        width: 28px;
        height: 28px;
        color: #2e6f46;
      }

      .initial-loader p {
        margin: 0;
        color: #18432c;
        font-size: 0.78rem;
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      @keyframes initialLoaderOrbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="initial-loader" role="status" aria-live="polite">
        <div class="initial-loader__content">
          <div class="initial-loader__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 4 13c0-5 4-9 15-9 0 11-4 15-9 15Z"></path>
              <path d="M9 15c2-3 5-5 9-6"></path>
            </svg>
            <i class="initial-loader__glow"></i>
          </div>
          <p>ZENITH</p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
